name: deploy

# Dispara no push para main depois que o CI (ci.yml) já passou.
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write   # Workload Identity Federation — sem chave de SA

jobs:
  build-push-deploy:
    name: Build → Artifact Registry → Cloud Run
    runs-on: ubuntu-latest
    # Só executa se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Gate de aprovação manual: o ambiente 'production' precisa de required
    # reviewers configurados em Settings → Environments → production. Sem isso
    # o deploy pausa esperando aprovação humana (ver RUNBOOK_PROD.md §7).
    environment:
      name: production

    env:
      REGION:     ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AR_URL:     ${{ vars.ARTIFACT_URL }}   # <region>-docker.pkg.dev/<project>/pulso

    steps:
      - uses: actions/checkout@v4

      # Trim espaços em variáveis vindas do GitHub UI (copia/cola pode inserir trailing space)
      - name: Normalizar variáveis de ambiente
        run: |
          echo "AR_URL=$(echo "$AR_URL" | xargs)"           >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(echo "$PROJECT_ID" | xargs)"   >> "$GITHUB_ENV"
          echo "REGION=$(echo "$REGION" | xargs)"           >> "$GITHUB_ENV"

      # Autenticação via Workload Identity Federation (sem chave JSON)
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Configura Docker para usar o Artifact Registry como registry
      - name: Configurar Docker → Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Captura a imagem atual de pulso-serve ANTES do deploy (usada no rollback)
      - name: Capturar imagem anterior (rollback)
        id: prev
        run: |
          PREV=$(gcloud run services describe pulso-serve \
            --region  "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format  "value(spec.template.spec.containers[0].image)" 2>/dev/null || echo "")
          echo "image=$PREV" >> "$GITHUB_OUTPUT"

      # Build da imagem única (cmd sobrescrito por serviço no Cloud Run)
      - name: Build da imagem
        run: |
          IMAGE="${{ env.AR_URL }}/pulso:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${{ env.AR_URL }}/pulso:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push da imagem
        run: |
          docker push "${{ env.AR_URL }}/pulso:${{ github.sha }}"
          docker push "${{ env.AR_URL }}/pulso:latest"

      # Atualiza todos os serviços Cloud Run para a nova imagem
      - name: Deploy → Cloud Run
        run: |
          SERVICES=(
            pulso-ingest
            pulso-sink
            pulso-anomaly-detector
            pulso-llm-explainer
            pulso-serve
          )
          for svc in "${SERVICES[@]}"; do
            echo "→ Deployando $svc"
            gcloud run services update "$svc" \
              --image        "${{ env.IMAGE }}" \
              --region       "${{ env.REGION }}" \
              --project      "${{ env.PROJECT_ID }}" \
              --quiet
          done

      # Smoke test: aguarda o pulso-serve responder /health com HTTP 200.
      # Tenta por até 90 s (9 × 10 s) — Cloud Run pode levar alguns segundos
      # para estabilizar a nova revisão.
      - name: Smoke test — /health
        id: smoke
        run: |
          SERVE_URL=$(gcloud run services describe pulso-serve \
            --region  "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format  "value(status.url)")
          echo "serve_url=$SERVE_URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 9); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVE_URL/health" \
              -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
              --max-time 10 || echo "000")
            echo "Tentativa $i — HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done

          echo "Smoke test falhou após 90 s"
          exit 1

      # Rollback automático: se o smoke test falhou e existe imagem anterior,
      # retrocede pulso-serve para evitar que o deploy quebrado fique no ar.
      - name: Rollback automático (smoke falhou)
        if: failure() && steps.prev.outputs.image != ''
        run: |
          echo "Revertendo pulso-serve para ${{ steps.prev.outputs.image }}"
          SERVICES=(
            pulso-ingest
            pulso-sink
            pulso-anomaly-detector
            pulso-llm-explainer
            pulso-serve
          )
          for svc in "${SERVICES[@]}"; do
            gcloud run services update "$svc" \
              --image   "${{ steps.prev.outputs.image }}" \
              --region  "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --quiet || true
          done

      - name: URL do pulso-serve
        run: echo "serve → ${{ steps.smoke.outputs.serve_url }}"
