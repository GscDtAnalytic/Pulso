name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Contratos de camada (import-linter)
        run: uv run lint-imports
      - name: Testes
        run: uv run pytest

  ksql-test:
    # Testes de topologia ksqlDB: o ksql-test-runner roda offline (sem broker, sem
    # Schema Registry real) dentro da imagem do ksqldb-server. GH Actions tem docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de topologia (ksql-test-runner)
        run: make ksql-test

  schema-compat:
    # Enforcement de data contracts (shift-left). No CI validamos parseabilidade
    # dos .avsc; a compatibilidade BACKWARD ao vivo contra o Schema Registry roda
    # localmente via `make schema-check` (Redpanda do docker-compose). Subir um SR
    # confiavel no runner sera adicionado quando o producer/SR estiver no compose de CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Validar contratos Avro (parse)
        run: uv run python tools/check_schema_compat.py --offline

  governance-check:
    # Valida os artefatos de governanca (SLO YAML, Soda YAML, Prometheus rules)
    # sem necessidade de stack ao vivo. O `soda scan` real roda localmente pos
    # `make dbt-build` (requer DuckDB populado pelo lake-mirror).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Validar YAML de governanca
        run: uv run python -c "
import yaml, pathlib, sys
files = list(pathlib.Path('governance').rglob('*.yml'))
errors = []
for f in files:
    try:
        yaml.safe_load(f.read_text())
    except yaml.YAMLError as e:
        errors.append(f'{f}: {e}')
if errors:
    print('YAML invalido:', *errors, sep='\n'); sys.exit(1)
print(f'OK — {len(files)} arquivo(s) de governanca validos.')
"
