name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Contratos de camada (import-linter)
        run: uv run lint-imports
      - name: Testes (com cobertura)
        run: >
          uv run pytest
          --cov=pulso_domain --cov=pulso_infra --cov=pulso_ingest
          --cov=pulso_storage --cov=pulso_serve
          --cov-report=xml --cov-report=term-missing
      - name: Upload de cobertura para o Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ksql-test:
    # Testes de topologia ksqlDB: o ksql-test-runner roda offline (sem broker, sem
    # Schema Registry real) dentro da imagem do ksqldb-server. GH Actions tem docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de topologia (ksql-test-runner)
        run: make ksql-test

  schema-compat:
    # Enforcement de data contracts (shift-left): parse offline + compatibilidade
    # BACKWARD AO VIVO. Sobe um Redpanda, registra os contratos da branch
    # principal como baseline e checa os do PR contra ela — quebra de schema
    # bloqueia o merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa de origin/main para o baseline
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Subir Redpanda (Schema Registry)
        run: |
          docker run -d --name redpanda -p 18081:18081 \
            redpandadata/redpanda:v24.2.7 \
            redpanda start --smp 1 --memory 1G --reserve-memory 0M \
            --overprovisioned --schema-registry-addr 0.0.0.0:18081
          for i in $(seq 1 30); do
            curl -sf http://localhost:18081/subjects && break || sleep 2
          done
      - name: Extrair contratos de origin/main (baseline)
        run: |
          mkdir -p /tmp/baseline
          git archive origin/main contracts 2>/dev/null \
            | tar -x -C /tmp/baseline --strip-components=1 \
            || echo "sem baseline em origin/main (contratos novos)"
      - name: Validar contratos Avro (parse + compat BACKWARD ao vivo)
        run: |
          uv run python tools/check_schema_compat.py \
            --registry http://localhost:18081 \
            --baseline /tmp/baseline

  image-scan:
    # Scan de vulnerabilidade da imagem Docker (supply chain).
    # Trivy verifica HIGH/CRITICAL em OS packages e dependências Python.
    # Roda em paralelo com os outros jobs de CI — não depende deles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (para scan)
        run: docker build -t pulso:scan .

      - name: Trivy — scan HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulso:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  governance-check:
    # Valida os artefatos de governanca (SLO YAML, Soda YAML, Prometheus rules)
    # sem necessidade de stack ao vivo. O `soda scan` real roda localmente pos
    # `make dbt-build` (requer DuckDB populado pelo lake-mirror).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Validar YAML de governanca
        run: |
          uv run python - <<'PYEOF'
          import yaml, pathlib, sys
          files = list(pathlib.Path('governance').rglob('*.yml'))
          errors = []
          for f in files:
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('YAML invalido:', *errors, sep='\n'); sys.exit(1)
          print(f'OK -- {len(files)} arquivo(s) de governanca validos.')
          PYEOF
