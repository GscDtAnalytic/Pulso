[project]
name = "pulso-storage"
version = "0.1.0"
description = "Lakehouse: writers Iceberg, dedup/MERGE idempotente, helpers de time-travel. (Marco 3)"
requires-python = ">=3.11"
dependencies = [
    "pulso-domain",
    "pulso-infra",
    "pyiceberg[s3fs,gcsfs,sql-postgres,pyiceberg-core]>=0.11",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "confluent-kafka[avro]>=2.5",
    "prometheus-client>=0.20",
]

[project.scripts]
pulso-sink = "pulso_storage.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_storage"]

[tool.uv.sources]
pulso-domain = { workspace = true }
pulso-infra = { workspace = true }
