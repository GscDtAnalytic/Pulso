[project]
name = "pulso-storage"
version = "0.1.0"
description = "Lakehouse: writers Iceberg, dedup/MERGE idempotente, helpers de time-travel. (Marco 3)"
requires-python = ">=3.11"
dependencies = [
    "pulso-domain",
    "pulso-infra",
    "pyiceberg[s3fs]>=0.7",
    "pyarrow>=17.0",
    "duckdb>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_storage"]

[tool.uv.sources]
pulso-domain = { workspace = true }
pulso-infra = { workspace = true }
