[project]
name = "pulso-infra"
version = "0.1.0"
description = "Infra transversal do Pulso: config tipada, logging estruturado, retry, circuit breaker, metricas."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "prometheus-client>=0.20",
    "openlineage-python>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_infra"]
