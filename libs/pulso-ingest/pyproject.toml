[project]
name = "pulso-ingest"
version = "0.1.0"
description = "Ingestao streaming: clients WebSocket de exchanges, producer idempotente, deteccao de gap. (Marco 1)"
requires-python = ">=3.11"
dependencies = [
    "pulso-domain",
    "pulso-infra",
    "websockets>=12.0",
    "httpx>=0.27",
    "confluent-kafka[avro]>=2.5",
    "tenacity>=8.5",
    "prometheus-client>=0.20",
]

[project.scripts]
pulso-ingest = "pulso_ingest.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_ingest"]

[tool.uv.sources]
pulso-domain = { workspace = true }
pulso-infra = { workspace = true }
