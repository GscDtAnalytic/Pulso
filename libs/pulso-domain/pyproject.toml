[project]
name = "pulso-domain"
version = "0.1.0"
description = "Dominio do Pulso: simbolos, exchanges e fonte de verdade (seed CSV). Camada base, sem dependencias de infra."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_domain"]
# seeds/symbols.csv vive dentro do pacote => incluido no wheel e resolvivel
# por importlib.resources tanto do codigo-fonte quanto instalado.
