[project]
name = "pulso-serve"
version = "0.1.0"
description = "Serving: API FastAPI — historico (marts dbt) + estado live (ksqlDB) + push WebSocket. (Marco 4)"
requires-python = ">=3.11"
dependencies = [
    "pulso-domain",
    "pulso-infra",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "duckdb>=1.0",
    "trino>=0.330",
    "confluent-kafka[avro]>=2.5",
    "prometheus-client>=0.20",
]

[project.scripts]
pulso-serve = "pulso_serve.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_serve"]

[tool.uv.sources]
pulso-domain = { workspace = true }
pulso-infra = { workspace = true }
